<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js v4 from CDN -->
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js"
    onerror="chartLibraryFailed = true; showToast('Chart library failed to load'); renderChart(transactions);"
  ></script>

  
</head>
<body>

  <div id="toast-container" aria-live="polite"></div>

  <main>
    <section id="input-section">
      <h1>Expense &amp; Budget Visualizer</h1>
      <div class="btn-dark"> <button onclick="togglemode()">Toggle dark mode</button></div>
      <!-- Input Form -->
      <form id="expense-form" class="container">
      
        <div class="form-group">
          <label for="item-name">Item Name</label>
          <br>
          <input
            type="text"
            id="item-name"
            name="item-name"
            maxlength="100"
            placeholder="e.g. Lunch"
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label for="item-amount">Amount ($)</label>
          <br>
          <input
            type="number"
            id="item-amount"
            name="item-amount"
            step="0.01"
            min="0.01"
            max="999999999.99"
            placeholder="0.00"
          />
        </div>

        <div class="form-group">
          <label for="item-category">Category</label>
          <br>
          <select id="item-category" name="item-category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>

        <button type="submit" class="btn-add">Add Expense</button>

        <div id="form-errors" role="alert"></div>
      </form>

      <!-- Balance Display -->
      <div id="balance-display" class="spent">
        <span class="balance-label">Total Spent</span>
        <br>
        <span id="balance-amount">$0.00</span>
      </div>
    <div class="row">
    <section id="list-section" class="col">
      <h2>Transactions</h2>
      
      <ul id="transaction-list">
        <!-- Transactions rendered here by JS -->
      </ul>
    </section>
      <!-- Pie Chart -->
      <div id="chart-container" class="col">
        <h2>Spending by Category</h2>
        <canvas id="spending-chart"></canvas>
        <div id="chart-empty-state">No spending data available.</div>
        <div id="chart-error">Chart could not be loaded.</div>
      </div>
      </div>
    </section>

    
  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
